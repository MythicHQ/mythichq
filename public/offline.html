<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101014" />
    <title>You’re offline | MythicHQ</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #101014; color: #f7f5f5; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #471719 0, #1b1114 42%, #101014 76%); }
      main { width: min(100%, 420px); padding: 38px 30px; text-align: center; border: 1px solid #ffffff1c; border-radius: 24px; background: #111116e8; box-shadow: 0 24px 80px #0009; }
      img { width: 64px; height: 64px; object-fit: contain; margin-bottom: 18px; }
      p { margin: 0 0 8px; color: #ff5563; font-size: 11px; font-weight: 800; letter-spacing: .16em; }
      h1 { margin: 0 0 12px; font-size: clamp(26px, 8vw, 34px); letter-spacing: -.04em; }
      .message { margin: 0 auto 24px; color: #b4b2bb; font-size: 14px; line-height: 1.6; }
      a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 0 22px; border-radius: 12px; background: #f7f5f5; color: #17151a; font-size: 14px; font-weight: 750; text-decoration: none; }
      a:focus-visible { outline: 3px solid #ff5667; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/mythichq-192.png" alt="MythicHQ" width="64" height="64" />
      <p>MYTHICHQ</p>
      <h1>You’re offline</h1>
      <div class="message">Your movie discovery experience will be ready as soon as your connection returns.</div>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
